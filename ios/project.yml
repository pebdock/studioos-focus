name: StudioFocus
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: it
targetTemplates:
  Application:
    type: application
    platform: iOS
    sources:
      - App
      - Shared/Block.swift
      - path: Offline
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pebdock.studioosfocus
        PRODUCT_NAME: StudioFocus
        SWIFT_OBJC_BRIDGING_HEADER: App/OfflineReader.h
        CLANG_ENABLE_OBJC_ARC: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: STUDIOOS Focus
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
targets:
  Base:
    templates: [Application]
  Live:
    templates: [Application]
    sources: [Shared/FocusAttributes.swift]
    info:
      path: Plists/Live.plist
      properties:
        NSSupportsLiveActivities: true
        CFBundleDisplayName: STUDIOOS Focus
        UILaunchScreen: {}
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LIVE"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    dependencies:
      - target: FocusActivity
  FocusActivity:
    type: app-extension
    platform: iOS
    sources: [Extension, Shared/FocusAttributes.swift]
    info:
      path: Plists/Activity.plist
      properties:
        CFBundleDisplayName: Timer Focus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pebdock.studioosfocus.activity
        SKIP_INSTALL: YES
  FocusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Live
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pebdock.focus.tests
        TEST_TARGET_NAME: Live
schemes:
  Base:
    build:
      targets:
        Base: all
  Live:
    build:
      targets:
        Live: all
    test:
      targets: [FocusUITests]
