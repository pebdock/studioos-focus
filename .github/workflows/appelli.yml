name: Appelli pubblici UniBo
# Aggiorna appelli.json ogni 3 ore leggendo solo pagine pubbliche: funziona con il PC spento.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/appelli/**', '.github/workflows/appelli.yml']
permissions:
  contents: write
concurrency:
  group: appelli
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: run
        run: node .github/appelli/aggiorna.mjs appelli.json
      - if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "studioos-appelli"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appelli.json
          git diff --cached --quiet && exit 0
          git commit -m "Appelli pubblici aggiornati"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
